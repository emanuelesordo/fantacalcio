<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gestione Utenti - Fantacalcio Live</title>

  <link
    rel="stylesheet"
    href="style.css?v=9"
  >
</head>

<body>

  <main class="page-shell">

    <header class="page-header">

      <div>
        <h1>Utenti</h1>
        <p>Account registrati nell'app</p>
      </div>

      <a
        class="back-home"
        href="index.html"
      >
        ← Home
      </a>

    </header>


    <nav class="tabs">

      <a
        href="setup-global.html"
        class="tab"
      >
        <span class="tab-title">
          Configurazione
        </span>

        <span class="tab-description">
          Impostazioni generali
        </span>
      </a>


      <a
        href="users-admin.html"
        class="tab active"
      >
        <span class="tab-title">
          Utenti
        </span>

        <span class="tab-description">
          Account e privilegi
        </span>
      </a>


<a
  href="leagues-admin.html"
  class="tab"
>

  <span class="tab-title">
    Leghe
  </span>

  <span class="tab-description">
    Gestione e approvazioni
  </span>

</a>

    </nav>


    <p
      id="admin-message"
      class="message"
      aria-live="polite"
    ></p>


    <section class="card">

      <div class="section-heading">

        <span class="section-label">
          USER
        </span>

        <div>
          <h2>Account registrati</h2>

          <p>
            Seleziona un utente per visualizzare
            e modificare le impostazioni
          </p>
        </div>

      </div>


      <div class="toolbar">

        <input
          id="user-search"
          type="search"
          placeholder="Cerca username..."
          autocomplete="off"
        >


        <select id="user-filter">

          <option value="all">
            Tutti
          </option>

          <option value="active">
            Attivi
          </option>

          <option value="disabled">
            Disattivati
          </option>

          <option value="superadmin">
            Super Admin
          </option>

          <option value="multileague">
            Multi-lega
          </option>

        </select>

      </div>


      <p
        id="users-count"
        class="setting-help"
      ></p>


      <div
        id="users-list"
        class="users-list"
      ></div>

    </section>

  </main>


  <script src="users-admin.js?v=3"></script>

</body>

</html>
