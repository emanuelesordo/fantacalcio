<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Setup Globale - Fantacalcio Live</title>

  <link
    rel="stylesheet"
    href="style.css?v=7"
  >
</head>


<body>

  <main class="admin-page">

    <header class="admin-header">

      <div>
        <h1>Setup Globale</h1>
        <p>Configurazione generale dell'app</p>
      </div>

      <a href="index.html">
        ← Home
      </a>

    </header>


    <nav class="admin-nav">

      <a
        href="setup-global.html"
        class="active"
      >
        Setup Globale
      </a>

      <a href="users-admin.html">
        Utenti
      </a>

      <span class="admin-nav-disabled">
        Leghe
      </span>

    </nav>


    <p
      id="admin-message"
      aria-live="polite"
    ></p>


    <section>

      <h2>Impostazioni globali</h2>


      <label class="setting-row">

        <span>
          <strong>Creazione nuove leghe</strong>
          <small>
            Consente agli utenti autorizzati di richiedere
            la creazione di nuove leghe.
          </small>
        </span>

        <input
          id="allow-league-creation"
          type="checkbox"
        >

      </label>


      <p class="setting-help">
        Il Super Admin può sempre creare nuove leghe,
        anche quando questa impostazione è disattivata.
      </p>


      <label class="setting-row">

        <span>
          <strong>Multi-lega globale</strong>
          <small>
            Consente agli utenti di partecipare a più leghe.
          </small>
        </span>

        <input
          id="multi-league-enabled"
          type="checkbox"
        >

      </label>


      <p class="setting-help">
        Gli override impostati sul singolo utente hanno
        sempre la precedenza sul setup globale.
      </p>


      <button
        id="save-global-settings"
        type="button"
      >
        Salva impostazioni
      </button>

    </section>

  </main>


  <script src="setup-global.js?v=2"></script>

</body>

</html>
