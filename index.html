<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fantacalcio Live</title>

  <link
    rel="stylesheet"
    href="style.css?v=3"
  >
</head>


<body>

  <main>

    <!-- AREA LOGIN -->
    <section id="login-area">

      <h1>Fantacalcio Live</h1>

      <form id="login-form">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          minlength="2"
          maxlength="30"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          required
        >


        <button type="submit">
          Entra
        </button>

      </form>


      <p
        id="message"
        aria-live="polite"
      ></p>

    </section>



    <!-- AREA UTENTE LOGGATO -->
    <section
      id="logged-area"
      hidden
    >

      <h1>
        Ciao,
        <span id="current-username"></span>
      </h1>

      <p>
        Accesso effettuato correttamente.
      </p>

      <a
  class="button"
  href="leagues.html"
>
  Le mie leghe
</a>
      
      <a
        id="global-setup-link"
        href="setup-global.html"
        hidden
      >
      Setup Globale
      </a>
      <button
        id="logout-button"
        type="button"
      >
        Esci
      </button>

    </section>

  </main>


  <!--
    Carichiamo SOLO il nuovo app.js.
    Nessun supabase.js e nessun vecchio script Auth.
  -->
  <script src="app.js?v=6"></script>

</body>

</html>
