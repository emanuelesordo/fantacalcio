<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Le mie leghe - Fantacalcio Live</title>

  <link
    rel="stylesheet"
    href="style.css?v=11"
  >

</head>


<body>

<main class="page-shell">


  <header class="page-header">

    <div>

      <h1>Le tue leghe</h1>

      <p>
        Seleziona una lega oppure
        entra in una nuova
      </p>

    </div>


    <a
      class="back-home"
      href="index.html"
    >
      ← Home
    </a>

  </header>


  <p
    id="page-message"
    class="message"
    aria-live="polite"
  ></p>


  <!-- LE MIE LEGHE -->

  <section class="card">

    <div class="section-heading">

      <span class="section-label">
        MY
      </span>

      <div>

        <h2>Le tue leghe</h2>

        <p>
          Leghe attive e richieste in corso
        </p>

      </div>

    </div>


    <div
      id="my-leagues"
      class="league-list"
    ></div>

  </section>


  <!-- UNISCITI -->

  <section
    id="join-section"
    class="card"
  >

    <div class="section-heading">

      <span class="section-label">
        JOIN
      </span>

      <div>

        <h2>Unisciti a una lega</h2>

        <p>
          Inserisci il codice fornito
          dall'Admin della lega
        </p>

      </div>

    </div>


    <form id="league-code-form">

      <label>

        Codice lega

        <input
          id="league-code"
          type="text"
          maxlength="12"
          placeholder="Es. A73F28C1"
          autocomplete="off"
          required
        >

      </label>


      <button type="submit">
        Cerca lega
      </button>

    </form>


    <div
      id="league-preview"
      hidden
    ></div>

  </section>


  <!-- CREA LEGA -->

  <section
    id="create-section"
    class="card"
    hidden
  >

    <div class="section-heading">

      <span class="section-label">
        NEW
      </span>

      <div>

        <h2>Crea una lega</h2>

        <p id="create-description">
          Crea una nuova lega
        </p>

      </div>

    </div>


    <form id="create-league-form">

      <label>

        Nome lega

        <input
          id="new-league-name"
          type="text"
          minlength="2"
          maxlength="80"
          placeholder="Es. Fantacalcio 2026/27"
          required
        >

      </label>


      <button type="submit">
        Crea lega
      </button>

    </form>

  </section>


</main>


<script src="leagues.js?v=1"></script>

</body>

</html>
