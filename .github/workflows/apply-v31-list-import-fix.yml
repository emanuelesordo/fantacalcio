name: Apply V31 list import fix
on:
  push:
    paths:
      - '.github/apply_v31_list_import_fix.py'
      - '.github/workflows/apply-v31-list-import-fix.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch list importer
        run: python .github/apply_v31_list_import_fix.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('home.html').read_text(encoding='utf-8')
          assert 'v31-list-import-style' in t
          assert 'xlsx-0.20.3' in t
          assert 'v13RowsFromSheet' in t
          assert 'v13-import-control' in t
          assert "accept='.csv,.xls,.xlsx,.numbers'" in t or 'accept=\'.csv,.xls,.xlsx,.numbers\'' in t
          scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',t,re.S|re.I)
          out=Path('/tmp/v31-inline');out.mkdir(exist_ok=True)
          for i,c in enumerate(scripts):(out/f'{i:03d}.js').write_text(c,encoding='utf-8')
          PY
          for f in /tmp/v31-inline/*.js; do node --check "$f"; done
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet -- home.html; then
            echo 'No home.html changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html
          git commit -m 'fix: stabilize list import and parse workbook tables'
          git push
