name: Wire V6Y+ runtime into home

on:
  push:
    paths:
      - .github/workflows/apply-v6y-v7-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch home.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home.html')
          text = p.read_text(encoding='utf-8')
          tag = '  <script src="v6y-v7.runtime.js"></script>\n'
          if tag not in text:
              marker = '</body>\n</html>'
              if marker not in text:
                  raise SystemExit('home.html closing marker not found')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate inline script and runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('home.html').read_text(encoding='utf-8')
          marker = "  <script>\n    'use strict';"
          start = text.index(marker) + len('  <script>\n')
          end = text.index('\n  </script>', start)
          Path('/tmp/home-inline.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/home-inline.js
          node --check v6y-v7.runtime.js
          git diff --check

      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v6y-v7-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html .github/workflows/apply-v6y-v7-home.yml
          git commit -m "feat: enable consolidated V6Y+ auction runtime"
          git push origin HEAD:main
