name: Apply V16 queue cards
on:
  push:
    paths:
      - '.github/workflows/apply-v16-queue-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply
        run: python3 .github/apply_v16_queue_and_cards.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/home-inline.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home-inline.js
          grep -q 'v16-auction-queue-cards-runtime' home.html
          grep -q 'Conferma CHIAMA entro' home.html
          grep -q 'auction-v7-prices' home.html
      - name: Commit
        run: |
          rm -f .github/workflows/apply-v16-queue-cards.yml .github/apply_v16_queue_and_cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require queue call confirmation and compact auction cards"
          git push origin main
