name: Capture V23 auction
on:
  push:
    paths:
      - '.github/workflows/capture-v23-auction.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('home.html').read_text(encoding='utf-8').splitlines()
          needles=['Console rilanci','auction-live-shell','auction-command','auction-banditore','auction-free-fixed','auction-team-column-roster-only']
          out=[]
          for needle in needles:
            hits=[i for i,l in enumerate(s) if needle in l]
            for i in hits[:2]:
              a=max(0,i-50);b=min(len(s),i+130)
              out.append(f'===== {needle} @ {i+1} =====');out.extend(s[a:b])
          Path('.github/v23-auction.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v23-auction.txt
          git commit -m 'build: capture V23 auction structure'
          git push
