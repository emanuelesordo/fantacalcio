name: Fix V8 Mantra 4-4-1-1

on:
  push:
    paths:
      - .github/workflows/fix-v8-mantra-4411.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct module label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home.html')
          text = p.read_text(encoding='utf-8')
          old = "'4-M-1-1':[['Por'],['Dd'],['Dc'],['Dc'],['Ds'],['M'],['C'],['E','W'],['E','W'],['T','A'],['A','Pc']]"
          new = "'4-4-1-1':[['Por'],['Dd'],['Dc'],['Dc'],['Ds'],['M'],['C'],['E','W'],['E','W'],['T','A'],['A','Pc']]"
          if old not in text:
              raise SystemExit('old module label not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('home.html').read_text(encoding='utf-8')
          for i,s in enumerate([x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S) if x.strip()]):
              Path(f'/tmp/fix-v8-{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/fix-v8-*.js; do node --check "$f"; done
          git diff --check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-v8-mantra-4411.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html .github/workflows/fix-v8-mantra-4411.yml
          git commit -m "fix: use official Mantra 4-4-1-1 module label"
          git push origin HEAD:main
