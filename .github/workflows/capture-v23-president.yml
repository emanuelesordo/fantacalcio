name: Capture V23 president
on:
  push:
    paths:
      - '.github/workflows/capture-v23-president.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('home.html').read_text(encoding='utf-8').splitlines()
          needles=['data-bid-offset','president-bid','quickOffsets','RILANCIO LIBERO','auction-command-buttons','auction-president']
          out=[]
          for needle in needles:
            hits=[i for i,l in enumerate(s) if needle.lower() in l.lower()]
            for i in hits[:3]:
              a=max(0,i-35);b=min(len(s),i+110)
              out.append(f'===== {needle} @ {i+1} =====');out.extend(s[a:b])
          Path('.github/v23-president.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v23-president.txt
          git commit -m 'build: capture president controls'
          git push
