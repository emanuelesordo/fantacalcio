name: Apply V34c market gradient
on:
  push:
    branches: [main]
    paths:
      - '.github/apply_v34c_market_gradient.py'
      - '.github/workflows/apply-v34c-market-gradient.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V34c
        run: python .github/apply_v34c_market_gradient.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('home.html').read_text(encoding='utf-8')
          assert '<title>Fantacalcio Live</title>' in t
          assert 'Fantacalcio Live - tool per asta online' in t
          assert '.75*pma+.25*pfc' in t
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          Path('/tmp/v34cscripts').mkdir(exist_ok=True)
          for i,s in enumerate(scripts): Path(f'/tmp/v34cscripts/{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/v34cscripts/*.js; do node --check "$f"; done
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html
          git diff --cached --quiet || git commit -m "fix: align live market gradient with PMA weighted UD"
          git push
