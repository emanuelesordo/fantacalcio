name: Inspect V14 targets
on:
  push:
    paths:
      - '.github/workflows/inspect-v14-targets.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          echo '=== STRATEGY ACCESS ==='
          grep -n -C 12 "v10StrategicAllowed\|state.view==='strategy'\|data-route=\"strategy\"\|loadStrategyView" home.html | tail -n 260 || true
          echo '=== CALLED PLAYER ==='
          grep -n -C 35 "auction-command-player\|CALCIATORE CHIAMATO\|Calciatore chiamato" home.html | head -n 360 || true
          echo '=== V13 TOOLBAR ==='
          grep -n -C 18 "v13-toolbar\|v13-import\|v13-filter-row\|v13NumericMatch\|v13Header" home.html | tail -n 420 || true
