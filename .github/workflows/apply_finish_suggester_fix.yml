name: Apply finish and suggester fixes
on:
  push:
    paths:
      - '.github/workflows/apply_finish_suggester_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch
        run: python3 .github/patch_finish_suggester.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/home-inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home-inline.js
          grep -q "await loadAuction({" home.html
          grep -q "v10-suggester-row-fix" home.html
          grep -q "mb>0" home.html
      - name: Commit
        run: |
          rm -f .github/workflows/apply_finish_suggester_fix.yml .github/patch_finish_suggester.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh auction finish and compact strategic suggester"
          git push origin main
