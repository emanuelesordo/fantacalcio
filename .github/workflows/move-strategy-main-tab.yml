name: Move strategy to main navigation

on:
  push:
    paths:
      - '.github/workflows/move-strategy-main-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 .github/move_strategy_main.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          Path('/tmp/all-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/all-inline.js
          grep -q 'data-view="strategy" href="#/strategy"' home.html
          grep -q 'id="view-strategy"' home.html
          ! grep -q 'patchDrawer()' home.html
      - name: Commit
        run: |
          rm -f .github/workflows/move-strategy-main-tab.yml .github/workflows/inspect-main-nav.yml .github/move_strategy_main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: move strategic center to main navigation"
          git push origin main
