name: Move strategy to main navigation

on:
  push:
    paths:
      - '.github/workflows/move-strategy-main-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move strategy UI out of auction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label,count=1):
              global s
              if old not in s:
                  raise SystemExit(f'marker not found: {label}')
              s=s.replace(old,new,count)

          # Documentation route.
          rep('    home.html#/rosters\n    home.html#/auction\n',
              '    home.html#/rosters\n    home.html#/strategy\n    home.html#/auction\n',
              'route docs')

          # Main sidebar tab: between Rose and Asta.
          rep('      <a class="nav-btn" data-view="rosters" href="#/rosters"><span class="nav-glyph">◫</span><span>Rose</span></a>\n      <a class="nav-btn" data-view="auction" href="#/auction"><span class="nav-glyph">◆</span><span>Asta</span></a>',
              '      <a class="nav-btn" data-view="rosters" href="#/rosters"><span class="nav-glyph">◫</span><span>Rose</span></a>\n      <a class="nav-btn" data-view="strategy" href="#/strategy"><span class="nav-glyph">◇</span><span>Strategia</span></a>\n      <a class="nav-btn" data-view="auction" href="#/auction"><span class="nav-glyph">◆</span><span>Asta</span></a>',
              'main nav')

          # Standalone workspace view.
          rep('      <!-- ASTA -->\n      <section id="view-auction" class="view no-page-scroll">',
              '''      <!-- STRATEGIA -->
      <section id="view-strategy" class="view no-page-scroll">
        <div class="v9-strategy-page">
          <nav class="v9-drawer-tabs v9-strategy-tabs" aria-label="Strategia e statistiche">
            <button type="button" class="v9-drawer-tab active" data-v9-tab="strategy">CENTRO STRATEGICO</button>
            <button type="button" class="v9-drawer-tab" data-v9-tab="stats">STATISTICHE</button>
          </nav>
          <div class="v9-strategy-content">
            <div class="v9-pane v9-pane-strategy" data-v9-pane="strategy"></div>
            <div class="v9-pane v9-pane-stats" data-v9-pane="stats" hidden></div>
          </div>
        </div>
      </section>

      <!-- ASTA -->
      <section id="view-auction" class="view no-page-scroll">''',
              'strategy view')

          # Router and page metadata.
          rep("      rosters: { id: 'rosters', hash: '#/rosters', leagueRequired: true },\n      auction: { id: 'auction', hash: '#/auction', leagueRequired: true },",
              "      rosters: { id: 'rosters', hash: '#/rosters', leagueRequired: true },\n      strategy: { id: 'strategy', hash: '#/strategy', leagueRequired: true },\n      auction: { id: 'auction', hash: '#/auction', leagueRequired: true },",
              'routes object')
          rep("      rosters: { title: 'Rose', subtitle: 'Crediti, assegnazioni e capacità residua di tutte le squadre.' },\n      auction: { title: 'Asta live', subtitle: 'Cockpit operativo collegato allo stato autorevole del server.' },",
              "      rosters: { title: 'Rose', subtitle: 'Crediti, assegnazioni e capacità residua di tutte le squadre.' },\n      strategy: { title: 'Strategia', subtitle: 'Centro Strategico privato, preferiti, benchmark e statistiche pre-asta.' },\n      auction: { title: 'Asta live', subtitle: 'Cockpit operativo collegato allo stato autorevole del server.' },",
              'route meta')

          # Core loader delegates the new route to the V9 module.
          rep("        else if(state.view==='rosters')await loadRosters();\n        else if(state.view==='auction'||state.view==='tv')await loadAuction({quiet:!force});",
              "        else if(state.view==='rosters')await loadRosters();\n        else if(state.view==='strategy'&&typeof window.loadStrategyView==='function')await window.loadStrategyView(force);\n        else if(state.view==='auction'||state.view==='tv')await loadAuction({quiet:!force});",
              'loadCurrentView')

          # Command palette glyph mapping.
          rep("                  item.route === 'rosters' ? '◫' :\n                  item.route === 'auction' ? '◆' : '▣'",
              "                  item.route === 'rosters' ? '◫' :\n                  item.route === 'strategy' ? '◇' :\n                  item.route === 'auction' ? '◆' : '▣'",
              'command palette glyph')

          # V9 tabs now belong to the standalone view, not to a drawer.
          old_activate='''  function activateTab(name){
    const tab=name==='stats'?'stats':'strategy';
    state.v9ActiveDrawerTab=tab;
    const drawer=document.querySelector('.v9-strategy-drawer');
    if(!drawer)return;
    drawer.querySelectorAll('.v9-drawer-tab').forEach(b=>b.classList.toggle('active',b.dataset.v9Tab===tab));
    drawer.querySelectorAll('.v9-pane').forEach(p=>p.hidden=p.dataset.v9Pane!==tab);
    if(!drawer.open)return;
    if(tab==='stats')renderStats();else renderStrategy();
  }
  function patchDrawer(){
    const root=document.getElementById('auction-root');if(!root)return;
    let drawer=root.querySelector('.v9-strategy-drawer');
    if(!drawer){
      drawer=document.createElement('details');
      drawer.className='v9-strategy-drawer';
      drawer.innerHTML=`<summary>STRATEGIA</summary><div class="v9-drawer-shell"><nav class="v9-drawer-tabs"><button type="button" class="v9-drawer-tab" data-v9-tab="strategy">CENTRO STRATEGICO</button><button type="button" class="v9-drawer-tab" data-v9-tab="stats">STATISTICHE</button></nav><div class="v9-pane v9-pane-strategy" data-v9-pane="strategy"></div><div class="v9-pane v9-pane-stats" data-v9-pane="stats"></div></div>`;
      root.appendChild(drawer);
      drawer.querySelectorAll('[data-v9-tab]').forEach(b=>b.addEventListener('click',()=>activateTab(b.dataset.v9Tab)));
      drawer.addEventListener('toggle',()=>{
        state.v9DrawerOpen=drawer.open;
        if(drawer.open)activateTab(state.v9ActiveDrawerTab==='stats'?'stats':'strategy');
      });
    }
    const shouldOpen=state.v9DrawerOpen===true;
    if(drawer.open!==shouldOpen)drawer.open=shouldOpen;
    const tab=state.v9ActiveDrawerTab==='stats'?'stats':'strategy';
    drawer.querySelectorAll('.v9-drawer-tab').forEach(b=>b.classList.toggle('active',b.dataset.v9Tab===tab));
    drawer.querySelectorAll('.v9-pane').forEach(p=>p.hidden=p.dataset.v9Pane!==tab);
    if(drawer.open){
      if(tab==='stats')renderStats();else renderStrategy();
    }
  }
'''
          new_activate='''  function activateTab(name){
    const tab=name==='stats'?'stats':'strategy';
    state.v9ActiveDrawerTab=tab;
    const view=document.getElementById('view-strategy');
    if(!view)return;
    view.querySelectorAll('[data-v9-tab]').forEach(b=>b.classList.toggle('active',b.dataset.v9Tab===tab));
    view.querySelectorAll('[data-v9-pane]').forEach(p=>p.hidden=p.dataset.v9Pane!==tab);
    if(state.view!=='strategy')return;
    if(tab==='stats')renderStats();else renderStrategy();
  }

  function bindStrategyView(){
    const view=document.getElementById('view-strategy');
    if(!view||view.dataset.v9Bound==='1')return;
    view.dataset.v9Bound='1';
    view.querySelectorAll('[data-v9-tab]').forEach(b=>b.addEventListener('click',()=>activateTab(b.dataset.v9Tab)));
  }

  window.loadStrategyView=async function(force=false){
    bindStrategyView();
    await loadV9(force===true);
    activateTab(state.v9ActiveDrawerTab==='stats'?'stats':'strategy');
  };
'''
          rep(old_activate,new_activate,'V9 drawer functions')

          # Auction wrappers must only suppress the old V8 pre-auction center.
          old_wrappers='''  const oldLive=renderAuctionLive;renderAuctionLive=function(...a){const r=oldLive(...a);queueMicrotask(()=>{document.querySelector('.v8center')?.remove();patchDrawer()});return r};
  const oldLobby=renderAuctionLobby;renderAuctionLobby=function(...a){const r=oldLobby(...a);queueMicrotask(()=>{document.querySelector('.v8center')?.remove();patchDrawer()});return r};
  const oldPrepared=renderAuctionPrepared;renderAuctionPrepared=function(...a){const r=oldPrepared(...a);queueMicrotask(()=>{document.querySelector('.v8center')?.remove();patchDrawer()});return r};
  const oldLoadAuction=loadAuction;loadAuction=async function(...a){const r=await oldLoadAuction(...a);await loadV9();document.querySelector('.v8center')?.remove();patchDrawer();return r};
'''
          new_wrappers='''  const oldLive=renderAuctionLive;renderAuctionLive=function(...a){const r=oldLive(...a);queueMicrotask(()=>document.querySelector('.v8center')?.remove());return r};
  const oldLobby=renderAuctionLobby;renderAuctionLobby=function(...a){const r=oldLobby(...a);queueMicrotask(()=>document.querySelector('.v8center')?.remove());return r};
  const oldPrepared=renderAuctionPrepared;renderAuctionPrepared=function(...a){const r=oldPrepared(...a);queueMicrotask(()=>document.querySelector('.v8center')?.remove());return r};
  const oldLoadAuction=loadAuction;loadAuction=async function(...a){const r=await oldLoadAuction(...a);document.querySelector('.v8center')?.remove();return r};
'''
          rep(old_wrappers,new_wrappers,'auction V9 wrappers')

          # Replace drawer-only CSS with a full workspace page shell.
          start="  const v9DrawerStyle=document.createElement('style');v9DrawerStyle.textContent=`\n"
          end="  `;document.head.appendChild(v9DrawerStyle);\n"
          a=s.find(start)
          if a<0: raise SystemExit('drawer style start not found')
          b=s.find(end,a)
          if b<0: raise SystemExit('drawer style end not found')
          b+=len(end)
          page_style='''  const v9PageStyle=document.createElement('style');v9PageStyle.textContent=`
    #view-strategy{overflow:hidden!important}
    .v9-strategy-page{height:100%;min-height:0;display:grid;grid-template-rows:44px minmax(0,1fr);gap:8px}
    .v9-strategy-tabs{display:grid;grid-template-columns:minmax(150px,240px) minmax(150px,240px);justify-content:start;gap:5px;padding:5px;border:1px solid rgba(109,167,255,.16);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.022))}
    .v9-strategy-tabs .v9-drawer-tab{height:32px!important;min-height:32px!important;padding:4px 10px!important;border-radius:9px!important;font-size:8px!important}
    .v9-strategy-content{min-height:0;height:100%;overflow:hidden}
    #view-strategy .v9-pane{height:100%;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 2px 12px}
    #view-strategy .v9-pane[hidden]{display:none!important}
    #view-strategy .v9scroll{grid-template-columns:repeat(12,minmax(0,1fr));align-items:start;gap:8px}
    #view-strategy .v9card{grid-column:span 4;padding:14px;border-radius:14px}
    #view-strategy .v9card:first-child{grid-column:span 5}
    #view-strategy .v9card:nth-child(2){grid-column:span 3}
    #view-strategy .v9card:nth-child(3){grid-column:span 4}
    #view-strategy .v9-pane-stats .v9card{grid-column:span 6}
    #view-strategy .v9-pane-stats .v9card:last-child{grid-column:1/-1}
    #view-strategy .v9card-scroll{max-height:360px}
    #view-strategy .v9bestcols .v9card-scroll{max-height:420px}
    @media(max-width:1050px){#view-strategy .v9card,#view-strategy .v9card:first-child,#view-strategy .v9card:nth-child(2),#view-strategy .v9card:nth-child(3),#view-strategy .v9-pane-stats .v9card{grid-column:span 6}}
    @media(max-width:700px){.v9-strategy-page{grid-template-rows:42px minmax(0,1fr)}.v9-strategy-tabs{grid-template-columns:1fr 1fr;padding:4px}.v9-strategy-tabs .v9-drawer-tab{font-size:7px!important}#view-strategy .v9scroll{grid-template-columns:1fr}#view-strategy .v9card,#view-strategy .v9card:first-child,#view-strategy .v9card:nth-child(2),#view-strategy .v9card:nth-child(3),#view-strategy .v9-pane-stats .v9card,#view-strategy .v9-pane-stats .v9card:last-child{grid-column:1}}
  `;document.head.appendChild(v9PageStyle);
'''
          s=s[:a]+page_style+s[b:]

          # Initialization: Strategy is loaded only on its own route; Setup keeps rule loader.
          rep("  void loadV9(true).then(()=>{if(state.view==='auction')patchDrawer();if(state.view==='setup')loadRulesIntoSetup()});",
              "  bindStrategyView();\n  if(state.view==='strategy')void window.loadStrategyView(true);\n  if(state.view==='setup')void loadRulesIntoSetup();",
              'V9 initialization')

          p.write_text(s,encoding='utf-8')
          PY

          # Validate the final inline scripts as JavaScript.
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          Path('/tmp/all-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/all-inline.js
          grep -q 'data-view="strategy" href="#/strategy"' home.html
          grep -q 'id="view-strategy"' home.html
          ! grep -q 'patchDrawer()' home.html

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/move-strategy-main-tab.yml .github/workflows/inspect-main-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: move strategic center to main navigation"
          git push origin main
