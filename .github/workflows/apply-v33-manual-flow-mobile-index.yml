name: Apply V33 manual flow mobile index
on:
  push:
    paths:
      - '.github/workflows/apply-v33-manual-flow-mobile-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/apply_v33_manual_flow_mobile_index.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          assert 'v33-manual-flow-mobile-index-runtime' in s
          assert 'Asta manuale · senza coda e timer' in s
          assert '<title>Fantacalcio Live</title>' in s
          Path('/tmp/home.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home.js
      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-v33-manual-flow-mobile-index.yml .github/apply_v33_manual_flow_mobile_index.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add manual auction flow and refine mobile list index"
          git push origin main
