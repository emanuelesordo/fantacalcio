name: Apply V47 Listone hide

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_v47_list_hide.py'
      - '.github/workflows/apply-v47-list-hide.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V47 patch
        run: python .github/apply_v47_list_hide.py

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('home.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          out=[]
          for i,s in enumerate(scripts):
              p=Path(f'/tmp/home-script-{i}.js')
              p.write_text(s, encoding='utf-8')
              out.append(str(p))
          print('\n'.join(out))
          PY
          for f in /tmp/home-script-*.js; do node --check "$f"; done

      - name: Diff check
        run: git diff --check

      - name: Commit application file
        run: |
          if git diff --quiet -- home.html; then
            echo 'No home.html changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html
          git commit -m 'feat: hide players from general Listone per tab'
          git push origin main
