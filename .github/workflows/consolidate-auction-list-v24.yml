          new_drawer_controls = r'''    function renderAuctionDrawerControls() {
      const players = state.auction?.callCandidates || [];
      const mode = state.auction?.settings?.fantasy_mode || 'classic';
      auctionFreeEnsureRanges(players);

      renderRoleBar(
        $('auction-rolebar'),
        state.auctionRoles,
        mode,
        next => {
          state.auctionRoles = next;
          renderAuctionPlayers();
        }
      );

      const fixed = document.querySelector('#view-auction .auction-free-fixed');
      if (!fixed) return;

      fixed.addEventListener('click', event => {
        const sortButton = event.target.closest('[data-auction-sort]');
        if (sortButton) {
          event.preventDefault();
          event.stopPropagation();
          const key = sortButton.dataset.auctionSort;
          state.auctionSort = state.auctionSort?.key === key
            ? { key, direction: state.auctionSort.direction === 'asc' ? 'desc' : 'asc' }
            : { key, direction: 'asc' };
          renderAuctionPlayers();
          updateAuctionSortIndicators();
          return;
        }

        const toggle = event.target.closest('[data-auction-range-toggle]');
        if (toggle) {
          event.preventDefault();
          event.stopPropagation();
          const key = toggle.dataset.auctionRangeToggle;
          const popover = fixed.querySelector(`[data-auction-range-popover="${key}"]`);
          const open = popover?.hidden !== false;
          closeAuctionFreeRanges(open ? key : '');
          if (popover) popover.hidden = !open;
          toggle.closest('[data-auction-range-box]')?.classList.toggle('open', open);
          if (open) updateAuctionFreeRangeVisual(key);
          return;
        }

        const reset = event.target.closest('[data-auction-range-reset]');
        if (reset) {
          event.preventDefault();
          event.stopPropagation();
          const key = reset.dataset.auctionRangeReset;
          const range = state.auctionColumnRanges?.[key];
          if (!range) return;
          range.lo = range.min;
          range.hi = range.max;
          fixed.querySelectorAll(`[data-auction-range="${key}"]`).forEach(input => {
            input.value = input.dataset.bound === 'lo' ? range.lo : range.hi;
          });
          updateAuctionFreeRangeVisual(key);
          renderAuctionPlayers();
          return;
        }

        if (!event.target.closest('[data-auction-range-box]')) closeAuctionFreeRanges('');
      });

      fixed.addEventListener('input', event => {
        const rangeInput = event.target.closest('[data-auction-range]');
        if (rangeInput) {
          event.stopPropagation();
          const key = rangeInput.dataset.auctionRange;
          const bound = rangeInput.dataset.bound;
          const range = state.auctionColumnRanges?.[key];
          if (!range) return;
          const value = Number(rangeInput.value);
          if (bound === 'lo') {
            range.lo = Math.min(value, range.hi);
            rangeInput.value = range.lo;
          } else {
            range.hi = Math.max(value, range.lo);
            rangeInput.value = range.hi;
          }
          updateAuctionFreeRangeVisual(key);
          renderAuctionPlayers();
          return;
        }

        const filter = event.target.closest('[data-auction-filter]');
        if (filter && filter.tagName !== 'SELECT') {
          state.auctionColumnFilters = state.auctionColumnFilters || {};
          state.auctionColumnFilters[filter.dataset.auctionFilter] = filter.value;
          renderAuctionPlayers();
        }
      });

      fixed.addEventListener('change', event => {
        const filter = event.target.closest('[data-auction-filter]');
        if (!filter) return;
        state.auctionColumnFilters = state.auctionColumnFilters || {};
        state.auctionColumnFilters[filter.dataset.auctionFilter] = filter.value;
        renderAuctionPlayers();
      });

      requestAnimationFrame(() => Object.keys(AUCTION_FREE_NUMERIC).forEach(updateAuctionFreeRangeVisual));
      updateAuctionSortIndicators();
    }


