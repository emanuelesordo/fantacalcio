name: Consolidate auction free-agent table V24

on:
  push:
    paths:
      - '.github/workflows/consolidate-auction-list-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consolidate auction table and smartphone mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('home.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_between(src, start_marker, end_marker, replacement, label):
              start = src.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker not found')
              end = src.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker not found')
              return src[:start] + replacement + src[end:]

          # -----------------------------------------------------------------
          # 1. Remove the intermediate V19 auction-table renderer completely.
          # -----------------------------------------------------------------
          text, count = re.subn(
              r'\n*<script id="v19-auction-list-controls-runtime">.*?</script>\s*',
              '\n\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'V19 auction runtime removal count={count}')

          # -----------------------------------------------------------------
          # 2. V18 keeps modals/HOLD/assign-turn, but no longer owns the table.
          # -----------------------------------------------------------------
          v18_start = text.find('<script id="v18-auction-controls-runtime">')
          v18_end = text.find('</script>', v18_start)
          if v18_start < 0 or v18_end < 0:
              raise RuntimeError('V18 runtime not found')
          v18_end += len('</script>')
          v18 = text[v18_start:v18_end]

          filter_start = v18.find('  /* =========================================================\n     FILTRI PER COLONNA NELLA LISTA SVINCOLATI')
          filter_end = v18.find('  /* Squadra operativa cambiata:', filter_start)
          if filter_start < 0 or filter_end < 0:
              raise RuntimeError('V18 filter section markers not found')
          v18 = (
              v18[:filter_start]
              + '''  /* =========================================================
     LISTA SVINCOLATI: renderer unico nel core asta
     ========================================================= */
  if(typeof renderAuctionLive==='function'){
    const old=renderAuctionLive;
    renderAuctionLive=function(...a){
      const r=old(...a);
      queueMicrotask(()=>{patchCalledDetails();mountAssignTurn();moveCallButtonTop();});
      return r;
    };
  }

'''
              + v18[filter_end:]
          )

          # Remove the V18 CSS that used to govern caller/table/filter geometry.
          v18, css_count = re.subn(
              r'\n    #view-auction \.auction-caller-controls\{.*?(?=\n    #view-auction \.auctioneer-functions-section)',
              '\n',
              v18,
              count=1,
              flags=re.S,
          )
          if css_count != 1:
              raise RuntimeError(f'V18 table CSS removal count={css_count}')
          v18 = v18.replace(
              'queueMicrotask(()=>{patchCalledDetails();mountAssignTurn();moveCallButtonTop();mountAuctionColumnFilters()});',
              'queueMicrotask(()=>{patchCalledDetails();mountAssignTurn();moveCallButtonTop();});'
          )
          text = text[:v18_start] + v18 + text[v18_end:]

          # -----------------------------------------------------------------
          # 3. V22 keeps pricing/SUGG/MAX and Listone integration, but it no
          #    longer mutates the auction table. Correct the economic coloring.
          # -----------------------------------------------------------------
          v22_start = text.find('<script id="v22-index-pricing-filters-runtime">')
          v22_end = text.find('</script>', v22_start)
          if v22_start < 0 or v22_end < 0:
              raise RuntimeError('V22 runtime not found')
          v22_end += len('</script>')
          v22 = text[v22_start:v22_end]

          v22, paint_count = re.subn(
              r'  function paintRows22\(root,players\)\{.*?\n  \}',
              '''  function paintRows22(root,players){
    if(!owner22()||!root)return;
    const by=new Map(players.map(p=>[String(p.id),p]));
    root.querySelectorAll('tr[data-player-id]').forEach(row=>{
      const p=by.get(String(row.dataset.playerId));if(!p)return;
      const idx=index22(p),pfc=num22(p?.pfc),pma=num22(p?.pma);
      const vals=[pfc,pma].filter(v=>v!==null&&v>0);
      row.classList.remove('v22-market-value-row');
      row.style.removeProperty('--v22-hue');row.style.removeProperty('--v22-alpha');
      if(!idx||!vals.length)return;
      const allAbove=vals.every(v=>v>idx),allBelow=vals.every(v=>v<idx);
      const hue=allAbove?2:allBelow?132:48;
      const distance=vals.reduce((sum,v)=>sum+Math.abs(v-idx),0)/vals.length/Math.max(1,idx);
      const alpha=.05+.08*clamp22(distance,0,1);
      row.classList.add('v22-market-value-row');
      row.style.setProperty('--v22-hue',String(hue));
      row.style.setProperty('--v22-alpha',String(alpha.toFixed(3)));
      row.title=`Indice ${Math.round(idx)} cr · PFC ${pfc??'—'} · PMA ${pma??'—'} · ${allAbove?'sopra indice':allBelow?'sotto indice':'valori discordanti'}`;
    });
  }''',
              v22,
              count=1,
              flags=re.S,
          )
          if paint_count != 1:
              raise RuntimeError(f'V22 paintRows replacement count={paint_count}')

          block_start = v22.find('  const NUM22={')
          block_end = v22.find('  function patchListSort22(){', block_start)
          if block_start < 0 or block_end < 0:
              raise RuntimeError('V22 auction filter block markers not found')
          v22 = v22[:block_start] + '  /* Auction filters consolidated into the core renderer. */\n\n' + v22[block_end:]

          v22 = re.sub(
              r"\n  if\(typeof renderAuctionPlayers==='function'\)\{[^\n]*\}\n  if\(typeof renderAuctionLive==='function'\)\{[^\n]*\}",
              '',
              v22,
              count=1,
          )
          v22 = v22.replace(
              "queueMicrotask(()=>{if(state.view==='auction')mountTable22();if(state.view==='list')patchListSort22();});",
              "queueMicrotask(()=>{if(state.view==='list')patchListSort22();});"
          )

          style_start = v22.find("  const style=document.createElement('style');style.id='v22-index-pricing-style';style.textContent=`")
          style_end_marker = '`;document.head.appendChild(style);'
          style_end = v22.find(style_end_marker, style_start)
          if style_start < 0 or style_end < 0:
              raise RuntimeError('V22 style block not found')
          style_end += len(style_end_marker)
          v22_style = '''  const style=document.createElement('style');style.id='v22-index-pricing-style';style.textContent=`
    body.v10-index-owner #view-list tr.v22-market-value-row{background:linear-gradient(90deg,hsl(var(--v22-hue) 70% 46% / var(--v22-alpha)),transparent 82%)!important;box-shadow:inset 3px 0 0 hsl(var(--v22-hue) 75% 50% / .72)!important}
  `;document.head.appendChild(style);'''
          v22 = v22[:style_start] + v22_style + v22[style_end:]
          text = text[:v22_start] + v22 + text[v22_end:]

          # -----------------------------------------------------------------
          # 4. Core auction free-agent table: one renderer, one header/filter
          #    system, one set of column widths and Listone-style dual ranges.
          # -----------------------------------------------------------------
          helpers = r'''    const AUCTION_FREE_NUMERIC = {
      presence: { label: '%Tit', step: 1 },
      pfc: { label: 'PFC', step: 1 },
      pma: { label: 'PMA', step: 1 },
      delta: { label: 'Delta', step: 1 },
      fm: { label: 'FM', step: .01 },
      index: { label: 'Indice', step: 1 }
    };

    function auctionFreeFinite(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function auctionFreePresence(player) {
      const value = typeof strategicPresencePercent === 'function'
        ? strategicPresencePercent(player)
        : player?.expected_titolarity;
      return auctionFreeFinite(value) ?? 0;
    }

    function auctionFreeFantasyAverage(player) {
      const value = typeof strategicExpectedFantasyAverage === 'function'
        ? strategicExpectedFantasyAverage(player)
        : player?.expected_fantasy_avg;
      return auctionFreeFinite(value) ?? 0;
    }

    function auctionFreeDelta(player) {
      const imported = auctionFreeFinite(player?.pfc_pma_delta);
      if (imported !== null) return imported;
      const pfc = auctionFreeFinite(player?.pfc);
      const pma = auctionFreeFinite(player?.pma);
      return pfc !== null && pma !== null ? pfc - pma : null;
    }

    function auctionFreeIndex(player) {
      const value = typeof strategicValueIndex === 'function'
        ? strategicValueIndex(player)
        : 0;
      return auctionFreeFinite(value) ?? 0;
    }

    function auctionFreeNumericValue(player, key) {
      if (key === 'presence') return auctionFreePresence(player);
      if (key === 'pfc') return auctionFreeFinite(player?.pfc);
      if (key === 'pma') return auctionFreeFinite(player?.pma);
      if (key === 'delta') return auctionFreeDelta(player);
      if (key === 'fm') return auctionFreeFantasyAverage(player);
      if (key === 'index') return auctionFreeIndex(player);
      return null;
    }

    function auctionFreePreference(player) {
      const source = String(player?.source_player_id || player?.id || '');
      return state.v7Preferences?.get?.(source) || null;
    }

    function auctionFreeFavorite(player) {
      const pref = auctionFreePreference(player);
      return Boolean(pref?.is_favorite || pref?.strategy === 'top');
    }

    function auctionFreeSignalMatches(player, key) {
      if (!key) return true;
      if (typeof matchesFlag === 'function') return matchesFlag(player, key);
      if (key === 'market') return player?.market_flag === true;
      if (key === 'new') return player?.new_arrival === true;
      if (key === 'injury') {
        return player?.uncertain_return === true
          || Number(player?.unavailable_until_round || 0) >= Number(state.v13NextRound || 1);
      }
      if (key === 'penalties') {
        const n = typeof importedProbabilityPercent === 'function'
          ? importedProbabilityPercent(player?.penalty_probability)
          : Number(player?.penalty_probability || 0);
        return Number(n || 0) > 0;
      }
      if (key === 'free_kicks') {
        const n = typeof importedProbabilityPercent === 'function'
          ? importedProbabilityPercent(player?.free_kick_probability)
          : Number(player?.free_kick_probability || 0);
        return Number(n || 0) > 0;
      }
      return false;
    }

    function auctionFreeSignalSort(player) {
      return ['market', 'injury', 'new', 'penalties', 'free_kicks']
        .filter(key => auctionFreeSignalMatches(player, key))
        .join(',');
    }

    function auctionFreeRangeBounds(key, players) {
      const def = AUCTION_FREE_NUMERIC[key];
      const values = players
        .map(player => auctionFreeNumericValue(player, key))
        .filter(Number.isFinite);
      let min = values.length ? Math.min(...values) : 0;
      let max = values.length ? Math.max(...values) : def.step;
      if (def.step < 1) {
        min = Math.floor(min / def.step) * def.step;
        max = Math.ceil(max / def.step) * def.step;
      } else {
        min = Math.floor(min);
        max = Math.ceil(max);
      }
      if (min === max) max = min + def.step;
      return { min, max, step: def.step };
    }

    function auctionFreeEnsureRanges(players = state.auction?.callCandidates || []) {
      state.auctionColumnFilters = state.auctionColumnFilters || { name: '', badge: '', favorite: '' };
      state.auctionColumnRanges = state.auctionColumnRanges || {};
      const signature = [
        state.selectedLeague?.id || '',
        state.auction?.auctionSession?.id || '',
        state.v13NextRound || 1,
        players.length,
        players.slice(0, 16).map(player => [
          player.id,
          player.source_updated_at || player.updated_at || '',
          player.pfc,
          player.pma,
          player.expected_titolarity,
          player.expected_fantasy_avg
        ].join(':')).join('|')
      ].join('::');
      if (state.auctionColumnRangeKey === signature && Object.keys(state.auctionColumnRanges).length) return;
      const previous = state.auctionColumnRanges || {};
      const next = {};
      Object.keys(AUCTION_FREE_NUMERIC).forEach(key => {
        const bounds = auctionFreeRangeBounds(key, players);
        const old = previous[key];
        let lo = old ? Math.max(bounds.min, Math.min(bounds.max, Number(old.lo))) : bounds.min;
        let hi = old ? Math.max(bounds.min, Math.min(bounds.max, Number(old.hi))) : bounds.max;
        if (!Number.isFinite(lo)) lo = bounds.min;
        if (!Number.isFinite(hi)) hi = bounds.max;
        if (lo > hi) { lo = bounds.min; hi = bounds.max; }
        next[key] = { ...bounds, lo, hi };
      });
      state.auctionColumnRanges = next;
      state.auctionColumnRangeKey = signature;
    }

    function auctionFreeFormatRange(value, step = 1) {
      const n = Number(value);
      if (!Number.isFinite(n)) return '—';
      return step < 1
        ? n.toFixed(step <= .01 ? 2 : 1).replace('.', ',')
        : String(Math.round(n));
    }

    function auctionFreeRangeIsFull(key) {
      const r = state.auctionColumnRanges?.[key];
      return !r
        || (Math.abs(r.lo - r.min) < 1e-9 && Math.abs(r.hi - r.max) < 1e-9);
    }

    function auctionFreeRangeLabel(key) {
      const r = state.auctionColumnRanges?.[key];
      const def = AUCTION_FREE_NUMERIC[key];
      if (!r || auctionFreeRangeIsFull(key)) return 'tutto';
      return `${auctionFreeFormatRange(r.lo, def.step)}–${auctionFreeFormatRange(r.hi, def.step)}`;
    }

    function auctionFreeRangeControl(key) {
      const r = state.auctionColumnRanges?.[key];
      const def = AUCTION_FREE_NUMERIC[key];
      if (!r) return '';
      return `
        <div class="auction-range" data-auction-range-box="${key}">
          <button type="button" class="auction-range-toggle" data-auction-range-toggle="${key}" title="Intervallo ${esc(def.label)}">
            <span data-auction-range-label="${key}">${auctionFreeRangeLabel(key)}</span><i>⌄</i>
          </button>
          <div class="auction-range-popover" data-auction-range-popover="${key}" hidden>
            <div class="auction-range-values">
              <b data-auction-range-lo-label="${key}">${auctionFreeFormatRange(r.lo, def.step)}</b>
              <span>${esc(def.label)}</span>
              <b data-auction-range-hi-label="${key}">${auctionFreeFormatRange(r.hi, def.step)}</b>
            </div>
            <div class="auction-dual-range">
              <div class="auction-range-base"></div>
              <div class="auction-range-fill" data-auction-range-fill="${key}"></div>
              <input type="range" data-auction-range="${key}" data-bound="lo" min="${r.min}" max="${r.max}" step="${r.step}" value="${r.lo}" aria-label="Minimo ${esc(def.label)}">
              <input type="range" data-auction-range="${key}" data-bound="hi" min="${r.min}" max="${r.max}" step="${r.step}" value="${r.hi}" aria-label="Massimo ${esc(def.label)}">
            </div>
            <div class="auction-range-ends">
              <small>${auctionFreeFormatRange(r.min, def.step)}</small>
              <button type="button" data-auction-range-reset="${key}">azzera</button>
              <small>${auctionFreeFormatRange(r.max, def.step)}</small>
            </div>
          </div>
        </div>
      `;
    }

    function updateAuctionFreeRangeVisual(key) {
      const r = state.auctionColumnRanges?.[key];
      const def = AUCTION_FREE_NUMERIC[key];
      if (!r) return;
      document.querySelectorAll(`[data-auction-range-label="${key}"]`).forEach(node => {
        node.textContent = auctionFreeRangeLabel(key);
      });
      document.querySelectorAll(`[data-auction-range-lo-label="${key}"]`).forEach(node => {
        node.textContent = auctionFreeFormatRange(r.lo, def.step);
      });
      document.querySelectorAll(`[data-auction-range-hi-label="${key}"]`).forEach(node => {
        node.textContent = auctionFreeFormatRange(r.hi, def.step);
      });
      const span = Math.max(r.step, r.max - r.min);
      const left = (r.lo - r.min) / span * 100;
      const right = (r.hi - r.min) / span * 100;
      document.querySelectorAll(`[data-auction-range-fill="${key}"]`).forEach(node => {
        node.style.left = `${left}%`;
        node.style.width = `${Math.max(0, right - left)}%`;
      });
    }

    function closeAuctionFreeRanges(except = '') {
      document.querySelectorAll('#view-auction [data-auction-range-popover]').forEach(node => {
        if (node.dataset.auctionRangePopover !== except) node.hidden = true;
      });
      document.querySelectorAll('#view-auction [data-auction-range-box]').forEach(node => {
        const popover = node.querySelector('[data-auction-range-popover]');
        node.classList.toggle(
          'open',
          node.dataset.auctionRangeBox === except && popover?.hidden === false
        );
      });
    }

    function auctionFreeRoleRank(player, mode) {
      const order = mode === 'mantra'
        ? ['Por', 'B', 'Dd', 'Dc', 'Ds', 'E', 'M', 'C', 'T', 'W', 'A', 'Pc']
        : ['P', 'D', 'C', 'A'];
      const ranks = playerRoles(player, mode)
        .map(role => order.findIndex(item => item.toLowerCase() === String(role).toLowerCase()))
        .filter(index => index >= 0);
      return ranks.length ? Math.min(...ranks) : 999;
    }

    function auctionFreeMatches(player, mode) {
      const filters = state.auctionColumnFilters || {};
      const selectedRoles = state.auctionRoles;
      if (selectedRoles && !selectedRoles.has('all')) {
        const wanted = new Set([...selectedRoles].map(role => String(role).toLowerCase()));
        if (!playerRoles(player, mode).some(role => wanted.has(String(role).toLowerCase()))) return false;
      }

      const topSearch = String(state.auctionFilterSearch || '').trim();
      const columnSearch = String(filters.name || '').trim();
      for (const query of [topSearch, columnSearch].filter(Boolean)) {
        const matched = typeof playerSearchRank === 'function'
          ? playerSearchRank(player, query, mode) !== null
          : String(player?.name || '').toLowerCase().includes(query.toLowerCase());
        if (!matched) return false;
      }

      if (filters.badge && !auctionFreeSignalMatches(player, filters.badge)) return false;
      if (filters.favorite === 'on' && !auctionFreeFavorite(player)) return false;
      if (filters.favorite === 'off' && auctionFreeFavorite(player)) return false;

      return Object.keys(AUCTION_FREE_NUMERIC).every(key => {
        const r = state.auctionColumnRanges?.[key];
        if (!r) return true;
        const value = auctionFreeNumericValue(player, key);
        return Number.isFinite(value) && value >= r.lo - 1e-9 && value <= r.hi + 1e-9;
      });
    }

    function auctionFreeSortValue(player, key, mode) {
      if (key === 'role') return auctionFreeRoleRank(player, mode);
      if (key === 'name') return player?.name || '';
      if (key === 'badge') return auctionFreeSignalSort(player);
      if (key === 'favorite') return auctionFreeFavorite(player) ? 1 : 0;
      if (AUCTION_FREE_NUMERIC[key]) return auctionFreeNumericValue(player, key);
      return player?.name || '';
    }

    function auctionFreePlayers(mode) {
      const rows = (state.auction?.callCandidates || []).filter(player => auctionFreeMatches(player, mode));
      const key = state.auctionSort?.key || 'name';
      const direction = state.auctionSort?.direction === 'desc' ? -1 : 1;
      return rows.sort((a, b) => {
        const av = auctionFreeSortValue(a, key, mode);
        const bv = auctionFreeSortValue(b, key, mode);
        let compare;
        if (typeof av === 'number' && typeof bv === 'number') {
          compare = (Number.isFinite(av) ? av : -Infinity) - (Number.isFinite(bv) ? bv : -Infinity);
        } else {
          compare = String(av ?? '').localeCompare(String(bv ?? ''), 'it', { sensitivity: 'base' });
        }
        if (!compare) compare = String(a?.name || '').localeCompare(String(b?.name || ''), 'it', { sensitivity: 'base' });
        return compare * direction;
      });
    }

    function paintAuctionFreeEconomicRows(root, players) {
      if (!root) return;
      const username = String(state.dashboard?.currentUser?.username || state.session?.user?.username || '').toLowerCase();
      const enabled = document.body.classList.contains('v10-index-owner') || username === 'emanuelesordo';
      const byId = new Map(players.map(player => [String(player.id), player]));
      root.querySelectorAll('tr[data-player-id]').forEach(row => {
        row.classList.remove('v22-market-value-row', 'auction-market-value-row');
        row.style.removeProperty('--v22-hue');
        row.style.removeProperty('--v22-alpha');
        row.style.removeProperty('--auction-market-hue');
        row.style.removeProperty('--auction-market-alpha');
        if (!enabled) return;
        const player = byId.get(String(row.dataset.playerId));
        if (!player) return;
        const index = auctionFreeIndex(player);
        const pfc = auctionFreeFinite(player?.pfc);
        const pma = auctionFreeFinite(player?.pma);
        const values = [pfc, pma].filter(value => value !== null && value > 0);
        if (!(index > 0) || !values.length) return;
        const allAbove = values.every(value => value > index);
        const allBelow = values.every(value => value < index);
        const hue = allAbove ? 2 : allBelow ? 132 : 48;
        const distance = values.reduce((sum, value) => sum + Math.abs(value - index), 0)
          / values.length / Math.max(1, index);
        const alpha = .05 + .09 * Math.max(0, Math.min(1, distance));
        row.classList.add('auction-market-value-row');
        row.style.setProperty('--auction-market-hue', String(hue));
        row.style.setProperty('--auction-market-alpha', alpha.toFixed(3));
        row.title = `Indice ${Math.round(index)} cr · PFC ${pfc ?? '—'} · PMA ${pma ?? '—'} · ${allAbove ? 'prezzi sopra Indice' : allBelow ? 'prezzi sotto Indice' : 'prezzi discordanti'}`;
      });
    }

    async function toggleAuctionFreeFavorite(player, button) {
      if (!player || !button) return;
      button.disabled = true;
      try {
        const sourcePlayerId = player.source_player_id || player.id;
        const response = await api(
          ENDPOINTS.v6y,
          { action: 'toggleFavorite', sourcePlayerId },
          { quiet: true }
        );
        if (response?.preference) {
          state.v7Preferences = state.v7Preferences || new Map();
          state.v7Preferences.set(
            String(response.preference.source_player_id || sourcePlayerId),
            response.preference
          );
        }
        renderAuctionPlayers();
      } catch (error) {
        msg(error.message || 'Errore aggiornamento preferito.', 'error');
      } finally {
        button.disabled = false;
      }
    }

    function auctionFreeSortButton(key, label, title = '') {
      const active = state.auctionSort?.key === key;
      const arrow = active ? (state.auctionSort.direction === 'desc' ? '↓' : '↑') : '↕';
      return `<button type="button" data-auction-sort="${key}" ${title ? `title="${esc(title)}"` : ''}>${label} <span>${arrow}</span></button>`;
    }

'''

          marker = '    function renderAuctionFixedFreeAgents(hasPlayer, callerControlsHtml = \'\') {'
          if marker not in text:
              raise RuntimeError('renderAuctionFixedFreeAgents marker not found')
          text = text.replace(marker, helpers + marker, 1)

          new_fixed = r'''    function renderAuctionFixedFreeAgents(hasPlayer, callerControlsHtml = '') {
      const hasCallerControls = Boolean(String(callerControlsHtml || '').trim());
      const statusCardHtml = renderAuctionPresidentStatusBanner();
      const hasStatusCard = Boolean(String(statusCardHtml || '').trim());
      auctionFreeEnsureRanges(state.auction?.callCandidates || []);
      const filters = state.auctionColumnFilters || {};

      return `
        <aside class="auction-free-fixed ${hasCallerControls ? 'has-caller-controls' : 'no-caller-controls'} ${hasStatusCard ? 'has-status-card' : 'no-status-card'}">
          ${statusCardHtml}
          ${callerControlsHtml}

          <div class="auction-free-role-row">
            <div id="auction-rolebar" class="rolebar"></div>
          </div>

          <div class="drawer-table auction-free-table-wrap">
            <table class="player-table auction-free-table">
              <colgroup>
