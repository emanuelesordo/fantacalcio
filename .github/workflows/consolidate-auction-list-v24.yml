          const player = (data.callCandidates || []).find(item => item.id === button.dataset.auctionFavorite);
          if (player) void toggleAuctionFreeFavorite(player, button);
        });
      });

      body.querySelectorAll('[data-player-id]').forEach(row => {
        row.addEventListener('click', event => {
