    #view-auction .auction-range-ends{display:grid!important;grid-template-columns:1fr auto 1fr!important;align-items:center!important;gap:4px!important;font-size:6px!important;color:var(--soft)!important}
    #view-auction .auction-range-ends small:last-child{text-align:right!important}
    #view-auction .auction-range-ends button{height:18px!important;min-height:18px!important;padding:1px 4px!important;font-size:6px!important}
