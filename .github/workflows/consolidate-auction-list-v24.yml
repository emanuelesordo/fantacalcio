name: Consolidate auction free-agent table V24
on:
  push:
    paths:
      - '.github/workflows/consolidate-auction-list-v24.yml'
      - '.github/apply_v24_from_workflow.py'
  workflow_dispatch:
jobs:
  consolidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consolidate auction table and smartphone mode
        run: python .github/apply_v24_from_workflow.py
      - name: Persist diagnostics if consolidation failed
        run: |
          if [ -f .github/v24-error.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/v24-error.txt
            git commit -m 'debug: capture V24 consolidation failure'
            git push
            exit 1
          fi
      - name: Validate embedded JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('home.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
          out=Path('/tmp/fanta-inline-scripts');out.mkdir(exist_ok=True)
          for i,code in enumerate(scripts):
              (out/f'{i:03d}.js').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/fanta-inline-scripts/*.js; do node --check "$f"; done
      - name: Validate consolidation
        run: |
          git diff --check
          grep -q 'auction-free-table-consolidated-style' home.html
          grep -q 'v23-header-mode' home.html
          ! grep -q 'v19-auction-list-controls-runtime' home.html
          ! grep -q 'mountAuctionColumnFilters' home.html
          ! grep -q 'mountTable22()' home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html
          git commit -m 'fix: consolidate live auction free-agent table'
          git push
