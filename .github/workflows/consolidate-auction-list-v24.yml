    #view-auction .auction-heart.active{color:#ff688c!important;border-color:#ff688c!important;background:rgba(100,24,50,.28)!important}
    #view-auction .auction-action-empty{color:var(--muted)!important}
    body.v10-index-owner #view-auction tr.auction-market-value-row{background:linear-gradient(90deg,hsl(var(--auction-market-hue) 70% 46% / var(--auction-market-alpha)),transparent 82%)!important;box-shadow:inset 3px 0 0 hsl(var(--auction-market-hue) 78% 50% / .78)!important}
  </style>
'''
          if '<style id="auction-free-table-consolidated-style">' not in text:
              text = text.replace('</head>', unified_css + '\n</head>', 1)

          # -----------------------------------------------------------------
          # 6. Device-profile runtime stays for admin/profile persistence only;
          #    it must not cover the newer Full/Compact mobile surface.
          # -----------------------------------------------------------------
          dev_start = text.find('<script id="v23-device-profiles-runtime">')
          dev_end = text.find('</script>', dev_start)
          if dev_start < 0 or dev_end < 0:
              raise RuntimeError('v23 device profile runtime not found')
          dev_end += len('</script>')
          dev = text[dev_start:dev_end]
          dev, dev_count = re.subn(
              r"  function applyMobileMode23\(\)\{.*?\n  \}",
              '''  function applyMobileMode23(){
    const active=mobile23()&&state.view==='auction'&&session23()?.status==='live'&&president23();
    document.body.classList.remove('v23-mobile-auction-active','v23-mobile-smartphone-only','v23-mobile-pc-phone');
    document.body.classList.toggle('v23-device-smartphone-only',active&&state.v23DeviceProfile==='smartphone_only');
    document.body.classList.toggle('v23-device-pc-phone',active&&state.v23DeviceProfile==='pc_plus_phone');
    const legacy=document.getElementById('v23-mobile-auction');if(legacy)legacy.hidden=true;
  }''',
              dev,
              count=1,
              flags=re.S,
          )
          if dev_count != 1:
              raise RuntimeError(f'applyMobileMode23 replacement count={dev_count}')
          text = text[:dev_start] + dev + text[dev_end:]

          # -----------------------------------------------------------------
          # 7. Full/Compact selector belongs to the real app header. The mobile
          #    auction surface starts below it instead of covering it.
          # -----------------------------------------------------------------
          mob_start = text.find('<script id="v23-mobile-auction-mode-runtime">')
          mob_end = text.find('</script>', mob_start)
          if mob_start < 0 or mob_end < 0:
              raise RuntimeError('v23 mobile mode runtime not found')
          mob_end += len('</script>')
          mob = text[mob_start:mob_end]

          shell_mode_markup = '''      <header class="v23-mobile-head">
        <div class="v23-mobile-mode" role="group" aria-label="Modalità smartphone">
          <button type="button" data-v23-mode="full">COMPLETA</button>
          <button type="button" data-v23-mode="compact">RIDOTTA</button>
        </div>
        <div class="v23-mobile-credit">'''
          shell_credit_markup = '''      <header class="v23-mobile-head">
        <div class="v23-mobile-credit">'''
          if shell_mode_markup not in mob:
              raise RuntimeError('mobile shell mode markup not found')
          mob = mob.replace(shell_mode_markup, shell_credit_markup, 1)

          ensure_header = r'''  function ensureHeaderMode(){
    let box=qs('.v23-header-mode');
    if(box)return box;
    const host=qs('.app-head .head-actions')||qs('.head-actions');
    if(!host)return null;
    box=document.createElement('div');
    box.className='v23-header-mode';
    box.hidden=true;
    box.setAttribute('role','group');
    box.setAttribute('aria-label','Modalità smartphone asta live');
    box.innerHTML='<button type="button" data-v23-mode="full">COMPLETA</button><button type="button" data-v23-mode="compact">RIDOTTA</button>';
    box.addEventListener('click',event=>{const button=event.target.closest('[data-v23-mode]');if(button)setMode(button.dataset.v23Mode);});
    host.prepend(box);
    return box;
  }

'''
          ensure_shell_marker = '  function ensureShell(){'
          if ensure_shell_marker not in mob:
              raise RuntimeError('ensureShell marker not found')
          mob = mob.replace(ensure_shell_marker, ensure_header + ensure_shell_marker, 1)

          mob = mob.replace(
              '    const shell=ensureShell();ensureDrawerUi();\n    const active=isPhone()&&isLive();shell.hidden=!active;',
              '    const shell=ensureShell();ensureDrawerUi();const headerMode=ensureHeaderMode();\n    const active=isPhone()&&isLive();shell.hidden=!active;if(headerMode)headerMode.hidden=!active;',
              1,
          )
          mob = mob.replace(
              "    qsa('[data-v23-mode]',shell).forEach(b=>b.classList.toggle('active',b.dataset.v23Mode===mode));",
              "    qsa('[data-v23-mode]',headerMode||document).forEach(b=>b.classList.toggle('active',b.dataset.v23Mode===mode));",
              1,
          )
          mob = mob.replace(
              '    .v23-mobile-shell,.v23-mobile-drawer-ui{display:none}',
              '    .v23-mobile-shell,.v23-mobile-drawer-ui,.v23-header-mode{display:none}',
              1,
          )
          mob = mob.replace(
              'body.v23-mobile-auction .v23-mobile-shell{display:grid!important;position:fixed!important;inset:0!important;z-index:1900!important;',
              'body.v23-mobile-auction .v23-mobile-shell{display:grid!important;position:fixed!important;inset:calc(var(--header-h) + 8px) 0 0 0!important;z-index:1900!important;',
              1,
          )
          mob = mob.replace(
              '.v23-mobile-head{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:7px!important;align-items:center!important}',
              '.v23-mobile-head{display:grid!important;grid-template-columns:1fr!important;gap:7px!important;align-items:center!important}',
              1,
          )

          mobile_mode_css = r'''
      body.v23-mobile-auction .app-head{position:fixed!important;top:4px!important;left:4px!important;right:4px!important;z-index:2050!important;height:var(--header-h)!important;min-height:var(--header-h)!important}
      body.v23-mobile-auction .v23-header-mode{display:grid!important;grid-template-columns:1fr 1fr!important;gap:2px!important;min-width:116px!important;padding:2px!important;border:1px solid var(--line)!important;border-radius:8px!important;background:var(--panel2)!important}
      body.v23-mobile-auction .v23-header-mode button{height:29px!important;min-height:29px!important;padding:2px 5px!important;background:transparent!important;border-color:transparent!important;color:var(--soft)!important;font-size:7.5px!important;white-space:nowrap!important}
      body.v23-mobile-auction .v23-header-mode button.active{background:var(--primary)!important;color:#fff!important}
'''
          media_marker = '    @media(max-width:820px){\n      body.v23-mobile-auction{overflow:hidden!important}'
          if media_marker not in mob:
              raise RuntimeError('mobile CSS media marker not found')
          mob = mob.replace(
              media_marker,
              '    @media(max-width:820px){\n      body.v23-mobile-auction{overflow:hidden!important}\n' + mobile_mode_css.rstrip('\n'),
              1,
          )
          # Old shell-mode CSS is now inert, but remove it so there is one selector system.
          mob = re.sub(
              r'\n      \.v23-mobile-mode\{.*?\n      \.v23-mobile-credit\{',
              '\n      .v23-mobile-credit{',
              mob,
              count=1,
              flags=re.S,
          )
          text = text[:mob_start] + mob + text[mob_end:]

          # -----------------------------------------------------------------
          # Assertions: fail loudly rather than committing a partial patch.
          # -----------------------------------------------------------------
          required = [
              'auction-free-table-consolidated-style',
              'auction-free-filter-row',
              "auctionFreeRangeControl('presence')",
              "auctionFreeRangeControl('pfc')",
              "auctionFreeRangeControl('pma')",
              "auctionFreeRangeControl('delta')",
              "auctionFreeRangeControl('fm')",
              "auctionFreeRangeControl('index')",
              'auction-player-col-favorite',
              'data-auction-favorite',
              'v23-header-mode',
              'Ricerca giocatore',
              'auction-top-call good',
          ]
          for token in required:
              if token not in text:
                  raise RuntimeError(f'missing required token: {token}')

          forbidden = [
              'v19-auction-list-controls-runtime',
              'mountAuctionColumnFilters',
              'mountTable22()',
              'v22-filter-row',
          ]
          for token in forbidden:
              if token in text:
                  raise RuntimeError(f'legacy auction-table token still present: {token}')

          if text == original:
              raise RuntimeError('home.html was not changed')

          path.write_text(text, encoding='utf-8')
          print('home.html consolidated successfully')
          PY

      - name: Validate inline JavaScript and diff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('home.html').read_text(encoding='utf-8')
          out=Path('/tmp/fanta-inline-scripts');out.mkdir(exist_ok=True)
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
          for i,code in enumerate(scripts):
              (out/f'{i:03d}.js').write_text(code,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/fanta-inline-scripts/*.js; do node --check "$f"; done
          git diff --check
          grep -q 'auction-free-table-consolidated-style' home.html
          grep -q 'v23-header-mode' home.html
          ! grep -q 'v19-auction-list-controls-runtime' home.html
          ! grep -q 'mountAuctionColumnFilters' home.html
          ! grep -q 'mountTable22()' home.html

      - name: Commit consolidation
        shell: bash
        run: |
          if git diff --quiet -- home.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html
          git commit -m 'fix: consolidate live auction free-agent table'
          git push
