name: Apply V11 auction flow and listone patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/apply_v11_flow_score_listone.py'
      - '.github/workflows/apply-v11-flow-score-listone.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/apply_v11_flow_score_listone.py
      - name: Validate inline JS
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, sys, tempfile
          s=pathlib.Path('home.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts):
              if not js.strip():
                  continue
              p=pathlib.Path(f'/tmp/home-inline-{i}.js')
              p.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stdout); print(r.stderr); sys.exit(r.returncode)
          print('inline JS syntax OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: refresh auction flow and align listone UI'
            git push
          fi
