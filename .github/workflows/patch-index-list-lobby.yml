name: Patch lobby index list
on:
  push:
    paths:
      - '.github/workflows/patch-index-list-lobby.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch_index_list_lobby.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/home-inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home-inline.js
          grep -q 'strategicValueIndex(player)' home.html
          grep -q 'free_kicks' home.html
      - name: Commit
        run: |
          rm -f .github/workflows/patch-index-list-lobby.yml .github/workflows/inspect-current.yml .github/patch_index_list_lobby.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refresh auction lobby and expose strategic value index"
          git push origin main
