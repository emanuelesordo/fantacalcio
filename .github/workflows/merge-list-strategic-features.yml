name: Merge list strategic features
on:
  push:
    paths:
      - '.github/workflows/merge-list-strategic-features.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html'); s=p.read_text(encoding='utf-8')
          old="const oldRLT=renderListTable;renderListTable=function(...a){const r=oldRLT(...a);hearts();return r};const oldLL=loadList;loadList=async function(...a){const r=await oldLL(...a);await hydrate();hearts();return r};"
          new="const oldRLT=renderListTable;renderListTable=function(...a){const r=oldRLT(...a);hearts();return r};const oldLL=loadList;loadList=async function(...a){const r=await oldLL(...a);await hydrate();try{const z=await api(ENDPOINTS.strategy,{action:'getStrategicFeatures'},{quiet:true});if(z?.players?.length&&state.list?.players){const by=new Map(z.players.map(p=>[String(p.id),p]));state.list.players=state.list.players.map(p=>{const x=by.get(String(p.id));return x?{...p,strategic_features:x.strategic_features??p.strategic_features}:p});renderListTable()}}catch(e){console.warn('List strategic features',e)}hearts();return r};"
          if old not in s: raise SystemExit('oldLL marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/js
      - name: Commit
        run: |
          rm -f .github/workflows/merge-list-strategic-features.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use strategic import features in standalone list"
          git push origin main
