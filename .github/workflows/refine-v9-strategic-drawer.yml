name: Refine V9 strategic drawer

on:
  push:
    paths:
      - '.github/workflows/refine-v9-strategic-drawer.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refine embedded V9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          if '<!-- V9_STRATEGIC_DRAWER_START -->' not in s:
              raise SystemExit('V9 block not found')
          s=s.replace("v9ActiveDrawerTab:state.v9ActiveDrawerTab||'free'","v9ActiveDrawerTab:state.v9ActiveDrawerTab||'strategy'")
          old_top="const top=(state.auction?.callCandidates||state.v9Center?.players||[]).filter(p=>p.status==='available'||!p.status).map(p=>auctionSuggestedCallScore(p)).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);"
          new_top="const top=(state.auction?.callCandidates||state.v9Center?.players||[]).filter(p=>p.status==='available'||!p.status).map(p=>{try{return auctionSuggestedCallScore(p)}catch{return {player:p,score:Math.round(clamp(scoreValue(p)*12,0,100)),prices:{suggested:basePrice(p),ceiling:Math.round(basePrice(p)*1.15)}}}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);"
          s=s.replace(old_top,new_top)
          s=s.replace("if(bs+c.pr>benchBudget&&chosen.length>=10)continue;","if(bs+c.pr>benchBudget)continue;")
          pattern=r"  function patchDrawer\(\)\{.*?\n  \}\n\n  async function loadRulesIntoSetup"
          replacement=(
              "  function patchDrawer(){\n"
              "    const root=document.getElementById('auction-root');if(!root)return;\n"
              "    let drawer=root.querySelector('.v9-strategy-drawer');\n"
              "    if(!drawer){\n"
              "      drawer=document.createElement('details');\n"
              "      drawer.className='v9-strategy-drawer';\n"
              "      drawer.innerHTML=`<summary>STRATEGIA</summary><div class=\"v9-drawer-shell\"><nav class=\"v9-drawer-tabs\"><button type=\"button\" class=\"v9-drawer-tab\" data-v9-tab=\"strategy\">CENTRO STRATEGICO</button><button type=\"button\" class=\"v9-drawer-tab\" data-v9-tab=\"stats\">STATISTICHE</button></nav><div class=\"v9-pane v9-pane-strategy\" data-v9-pane=\"strategy\"></div><div class=\"v9-pane v9-pane-stats\" data-v9-pane=\"stats\"></div></div>`;\n"
              "      root.appendChild(drawer);\n"
              "      drawer.querySelectorAll('[data-v9-tab]').forEach(b=>b.addEventListener('click',()=>activateTab(b.dataset.v9Tab)));\n"
              "      drawer.addEventListener('toggle',()=>{state.v9DrawerOpen=drawer.open;if(drawer.open){renderStrategy();renderStats();}});\n"
              "    }\n"
              "    drawer.open=state.v9DrawerOpen===true;\n"
              "    renderStrategy();renderStats();\n"
              "    activateTab(state.v9ActiveDrawerTab==='stats'?'stats':'strategy');\n"
              "  }\n\n"
              "  async function loadRulesIntoSetup"
          )
          s2,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'patchDrawer replacement count={count}')
          s=s2
          marker="  void loadV9(true).then(()=>{if(state.view==='auction')patchDrawer();if(state.view==='setup')loadRulesIntoSetup()});"
          drawer_css=(
              "  const v9DrawerStyle=document.createElement('style');v9DrawerStyle.textContent=`\n"
              "    .v9-strategy-drawer{position:absolute;z-index:88;top:3px;right:0;bottom:3px;width:min(58vw,720px);min-width:430px;border:1px solid rgba(91,151,216,.38);border-radius:9px;background:rgba(6,24,43,.97);box-shadow:-14px 0 34px rgba(0,0,0,.38);overflow:hidden}\n"
              "    .v9-strategy-drawer:not([open]){width:31px;min-width:31px;max-width:31px;box-shadow:none}\n"
              "    .v9-strategy-drawer>summary{position:absolute;left:0;top:0;bottom:0;width:31px;list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;font-size:7px;font-weight:950;letter-spacing:.08em;background:rgba(44,78,112,.78);border-right:1px solid rgba(91,151,216,.28);z-index:3}\n"
              "    .v9-strategy-drawer>summary::-webkit-details-marker{display:none}.v9-strategy-drawer:not([open])>*:not(summary){display:none!important}\n"
              "    .v9-drawer-shell{height:100%;min-height:0;margin-left:31px;padding:4px;display:grid;grid-template-rows:25px minmax(0,1fr);gap:3px;overflow:hidden}\n"
              "    .v9-strategy-drawer .v9-drawer-tabs{display:grid;grid-template-columns:1.2fr 1fr;gap:3px;padding:0;background:transparent;border:0}\n"
              "    .v9-strategy-drawer .v9-pane{height:100%;min-height:0;overflow:auto;overscroll-behavior:contain}\n"
              "    .v9-strategy-drawer .v9-pane[hidden]{display:none!important}\n"
              "    @media(max-width:760px){.v9-strategy-drawer{width:min(94vw,620px);min-width:0}.v9-strategy-drawer:not([open]){width:29px;min-width:29px;max-width:29px}.v9-strategy-drawer>summary{width:29px}.v9-drawer-shell{margin-left:29px}.v9-strategy-drawer .v9-drawer-tabs{grid-template-columns:1fr 1fr}}\n"
              "  `;document.head.appendChild(v9DrawerStyle);\n\n"
          )
          if marker not in s:
              raise SystemExit('loadV9 marker not found')
          s=s.replace(marker,drawer_css+marker,1)
          p.write_text(s,encoding='utf-8')
          block=s.split('<!-- V9_STRATEGIC_DRAWER_START -->',1)[1].split('<!-- V9_STRATEGIC_DRAWER_END -->',1)[0]
          scripts=re.findall(r'<script>(.*?)</script>',block,flags=re.S)
          if not scripts:
              raise SystemExit('embedded V9 script not found')
          Path('/tmp/v9-final.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/v9-final.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/refine-v9-strategic-drawer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: move strategic center to dedicated auction drawer" || exit 0
          git push origin main
