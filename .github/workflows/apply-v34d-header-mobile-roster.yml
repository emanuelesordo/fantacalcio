name: Apply V34d header mobile roster
on:
  push:
    branches: [main]
    paths:
      - '.github/apply_v34d_header_mobile_roster.py'
      - '.github/workflows/apply-v34d-header-mobile-roster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V34d
        run: python .github/apply_v34d_header_mobile_roster.py
      - name: Validate HTML scripts and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('home.html').read_text(encoding='utf-8')
          assert '<title>Fantacalcio Live</title>' in t
          assert 'Fantacalcio Live - tool per asta online' in t
          assert 'v34d-header-mobile-roster-style' in t
          assert 'v34d-header-mobile-roster-runtime' in t
          assert "state.v34AuctioneerOpen=d.open===true" in t
          assert 'v34-mobile-roster-group' in t
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          Path('/tmp/v34dscripts').mkdir(exist_ok=True)
          for i,s in enumerate(scripts):
              Path(f'/tmp/v34dscripts/{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/v34dscripts/*.js; do node --check "$f"; done
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html
          git diff --cached --quiet || git commit -m "fix: restore live header and mobile roster slots"
          git push
