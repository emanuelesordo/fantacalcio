name: Apply V8 strategic runtime

on:
  push:
    paths:
      - .github/workflows/apply-v8-strategy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate V8 runtime
        shell: bash
        run: |
          cat v8-strategy.part1.js v8-strategy.part2.js v8-strategy.part3.js > /tmp/v8-strategy.js
          node --check /tmp/v8-strategy.js

      - name: Inline V8 runtime into canonical home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path('home.html')
          text = home.read_text(encoding='utf-8')
          js = Path('/tmp/v8-strategy.js').read_text(encoding='utf-8').rstrip()
          marker = '/* V8 strategic center + Mantra 2026/27 */'
          if marker in text:
              raise SystemExit('V8 runtime is already present in home.html')
          needle = '</body>'
          if needle not in text:
              raise SystemExit('closing body tag not found')
          text = text.replace(needle, '  <script>\n' + js + '\n  </script>\n' + needle, 1)
          home.write_text(text, encoding='utf-8')
          PY

      - name: Validate canonical home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('home.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = [s for s in scripts if s.strip()]
          for idx, source in enumerate(inline):
              Path(f'/tmp/home-v8-inline-{idx}.js').write_text(source, encoding='utf-8')
          print(f'inline scripts: {len(inline)}')
          PY
          for f in /tmp/home-v8-inline-*.js; do node --check "$f"; done
          git diff --check

      - name: Commit canonical V8 home
        shell: bash
        run: |
          rm -f v8-strategy.part1.js v8-strategy.part2.js v8-strategy.part3.js .github/workflows/apply-v8-strategy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html v8-strategy.part1.js v8-strategy.part2.js v8-strategy.part3.js .github/workflows/apply-v8-strategy.yml
          git commit -m "feat: add strategic center and Mantra intelligence"
          git push origin HEAD:main
