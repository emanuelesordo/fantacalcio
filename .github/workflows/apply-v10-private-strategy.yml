name: Apply V10 strategic privacy
on:
  push:
    paths:
      - '.github/workflows/apply-v10-private-strategy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_v10_private_strategy.py
      - name: Validate inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/home-inline.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home-inline.js
          grep -q 'v10-private-strategy-runtime' home.html
          grep -q 'strategic_access_mode' .github/apply_v10_private_strategy.py || true
      - name: Commit
        run: |
          rm -f .github/workflows/apply-v10-private-strategy.yml .github/apply_v10_private_strategy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: gate strategic tools and add private value visuals"
          git push origin main
