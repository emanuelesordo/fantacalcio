name: Inspect list setup import
on:
  push:
    paths:
      - '.github/workflows/inspect-list-setup-import.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          for p in \
            'function renderListTable' \
            'function playerRow' \
            'list-search' \
            'list-team' \
            'list-slot' \
            'list-flag' \
            'list-sort' \
            'list-rolebar' \
            'function populateSetup' \
            "$('setup-form').addEventListener('submit'" \
            'beginListImport' \
            'xlsx' \
            'csv' \
            'SheetJS' \
            'function loadList'; do
            echo "===== $p ====="
            grep -n -F "$p" home.html | head -n 40 || true
          done
