name: Apply V13 list index import
on:
  push:
    paths:
      - '.github/workflows/apply-v13-list-index-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_v13_list_index_import.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('home.html').read_text(encoding='utf-8')
          Path('/tmp/home.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/home.js
          grep -q 'v13-list-index-import-runtime' home.html
          grep -q 'IMPORTA CSV/XLSX' home.html
          grep -q 'Indice cr' home.html
      - name: Commit
        run: |
          rm -f .github/workflows/apply-v13-list-index-import.yml .github/workflows/inspect-list-setup-import.yml .github/apply_v13_list_index_import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: filterable list index credits next round and imports"
          git push origin main
