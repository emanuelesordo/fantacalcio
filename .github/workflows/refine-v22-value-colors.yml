name: Refine V22 value colors
on:
  push:
    paths:
      - '.github/workflows/refine-v22-value-colors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch market color comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          old="""            function marketReference22(p){const vals=[num22(p?.pfc),num22(p?.pma)].filter(v=>v!==null&&v>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;}\n            function paintRows22(root,players){\n              if(!owner22()||!root)return;\n              const by=new Map(players.map(p=>[String(p.id),p]));\n              root.querySelectorAll('tr[data-player-id]').forEach(row=>{const p=by.get(String(row.dataset.playerId));if(!p)return;const idx=index22(p),ref=marketReference22(p);row.classList.remove('v22-market-value-row');if(!idx||ref===null)return;const ratio=ref/idx;let hue=48;if(ratio<1)hue=48+82*clamp22((1-ratio)/.35,0,1);else hue=48*(1-clamp22((ratio-1)/.35,0,1));const intensity=.04+.07*clamp22(Math.abs(ratio-1)/.35,0,1);row.classList.add('v22-market-value-row');row.style.setProperty('--v22-hue',String(hue.toFixed(1)));row.style.setProperty('--v22-alpha',String(intensity.toFixed(3)));row.title=`Indice ${Math.round(idx)} cr · PFC ${num22(p.pfc)??'—'} · PMA ${num22(p.pma)??'—'} · riferimento medio ${ref.toFixed(1)} cr`;});\n            }\n"""
          new="""            function marketReference22(p){const vals=[num22(p?.pfc),num22(p?.pma)].filter(v=>v!==null&&v>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;}\n            function paintRows22(root,players){\n              if(!owner22()||!root)return;\n              const by=new Map(players.map(p=>[String(p.id),p]));\n              root.querySelectorAll('tr[data-player-id]').forEach(row=>{\n                const p=by.get(String(row.dataset.playerId));if(!p)return;\n                const idx=index22(p),pfc=num22(p?.pfc),pma=num22(p?.pma),vals=[pfc,pma].filter(v=>v!==null&&v>0);\n                row.classList.remove('v22-market-value-row');\n                if(!idx||!vals.length)return;\n                const ratios=vals.map(v=>v/idx),mean=ratios.reduce((a,b)=>a+b,0)/ratios.length;\n                const allBelow=ratios.every(r=>r<1),allAbove=ratios.every(r=>r>1);\n                let hue=48;\n                if(allBelow)hue=48+82*clamp22((1-mean)/.35,0,1);\n                else if(allAbove)hue=48*(1-clamp22((mean-1)/.35,0,1));\n                const intensity=.035+.065*clamp22(Math.abs(mean-1)/.35,0,1);\n                row.classList.add('v22-market-value-row');row.style.setProperty('--v22-hue',String(hue.toFixed(1)));row.style.setProperty('--v22-alpha',String(intensity.toFixed(3)));\n                const stateLabel=allBelow?'PFC/PMA sotto Indice':allAbove?'PFC/PMA sopra Indice':'PFC/PMA discordanti';\n                row.title=`Indice ${Math.round(idx)} cr · PFC ${pfc??'—'} · PMA ${pma??'—'} · ${stateLabel}`;\n              });\n            }\n"""
          if old not in s: raise SystemExit('market color block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '<title>Fantacalcio Live</title>' home.html
          grep -q 'Fantacalcio Live - tool per asta online' home.html
          node --check <(python3 - <<'PY'
          import re
          s=open('home.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          )
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/refine-v22-value-colors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html .github/workflows/refine-v22-value-colors.yml
          git commit -m 'refine: compare PFC and PMA directly with fixed index'
          git push
