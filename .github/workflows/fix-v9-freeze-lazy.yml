name: Fix V9 drawer freeze

on:
  push:
    paths:
      - 'tools/patch_v9_freeze.py'
      - '.github/workflows/fix-v9-freeze-lazy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python3 tools/patch_v9_freeze.py
          node --check /tmp/v9-fixed.js
          git diff --check
      - name: Commit
        run: |
          rm -f tools/patch_v9_freeze.py .github/workflows/fix-v9-freeze-lazy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop strategic drawer render loop and lazy-load stats"
          git push origin main
