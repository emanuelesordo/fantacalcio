name: Capture V23 manage
on:
  push:
    paths:
      - '.github/workflows/capture-v23-manage.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('home.html').read_text(encoding='utf-8').splitlines()
          needles=['function renderManagement','function renderManage','async function loadManage','manage-members','setMemberRole']
          out=[]
          for needle in needles:
            for i,l in enumerate(s):
              if needle in l:
                a=max(0,i-30);b=min(len(s),i+260)
                out.append(f'===== {needle} @ {i+1} =====')
                out.extend(s[a:b]);break
          Path('.github/v23-manage.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v23-manage.txt
          git commit -m 'build: capture manage functions'
          git push
