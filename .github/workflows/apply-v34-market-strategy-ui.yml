name: Apply V34 market strategy UI
on:
  push:
    branches: [main]
    paths:
      - '.github/apply_v34_market_strategy_ui.py'
      - '.github/workflows/apply-v34-market-strategy-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V34
        run: python .github/apply_v34_market_strategy_ui.py
      - name: Validate HTML scripts and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('home.html').read_text(encoding='utf-8')
          assert '<title>Fantacalcio Live</title>' in t
          assert 'Fantacalcio Live - tool per asta online' in t
          assert 'v34-market-strategy-runtime' in t
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          Path('/tmp/v34scripts').mkdir(exist_ok=True)
          for i,s in enumerate(scripts): Path(f'/tmp/v34scripts/{i}.js').write_text(s,encoding='utf-8')
          print(len(scripts),'inline scripts extracted')
          PY
          for f in /tmp/v34scripts/*.js; do node --check "$f"; done
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html
          git diff --cached --quiet || git commit -m "feat: revise live auction strategy and manual queue"
          git push
