name: Apply V21 index role redistribution
on:
  push:
    paths:
      - '.github/workflows/apply-v21-index-role-redistribution.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append V21 index role redistribution
        run: |
          cat > /tmp/v21.js <<'JS'
          (()=>{
            'use strict';
            if(window.__FANTA_V21_INDEX_ROLE_SPLIT__)return;
            window.__FANTA_V21_INDEX_ROLE_SPLIT__=1;

            const n21=v=>Number.isFinite(Number(v))?Number(v):null;
            const clamp21=(v,a,b)=>Math.max(a,Math.min(b,v));
            const OUTFIELD_USAGE=Object.freeze({1:1.00,2:.92,3:.80,4:.55,5:.38,6:.26,7:.16,8:.10});
            const KEEPER_USAGE=Object.freeze({1:1.00,2:.15,3:.05,4:.02,5:.01,6:.01,7:.01,8:.01});
            const KEEPER_TARGET_FM=5.50;

            function isKeeper21(p){
              const classic=String(p?.classic_role||'').toLowerCase();
              const mantra=Array.isArray(p?.mantra_roles)?p.mantra_roles.map(x=>String(x).toLowerCase()):[];
              return classic==='p'||classic==='por'||mantra.includes('por')||mantra.includes('p');
            }
            function nextRound21(){return clamp21(Number(state.v13NextRound||state.setup?.next_round||1),1,38);}
            function roundsRemaining21(){return Math.max(0,39-nextRound21());}
            function fmv21(p){const v=typeof strategicExpectedFantasyAverage==='function'?n21(strategicExpectedFantasyAverage(p)):n21(p?.expected_fantasy_avg);return Math.max(0,v??0);}
            function presence21(p){const v=typeof strategicPresencePercent==='function'?n21(strategicPresencePercent(p)):n21(p?.expected_titolarity);return clamp21(v??0,0,100);}
            function expectedGames21(p){
              const remaining=roundsRemaining21(),next=nextRound21(),until=Math.max(0,n21(p?.unavailable_until_round)??0),forced=until>=next?Math.min(remaining,until-next+1):0,available=Math.max(0,remaining-forced);
              return available*presence21(p)/100;
            }
            function targetAverage21(){const v=typeof strategicWinningTargetAverage==='function'?n21(strategicWinningTargetAverage()):null;return Math.max(1,v??72);}
            function fieldTarget21(){return Math.max(0,(targetAverage21()-KEEPER_TARGET_FM)/10);}
            function budget21(){return Math.max(1,n21(state.auction?.settings?.initial_credits)??n21(state.setup?.initial_credits)??500);}
            function creditPerPoint21(){const total=targetAverage21()*roundsRemaining21();return total>0?budget21()/total:0;}
            function slotUsage21(p){const slot=clamp21(Math.round(n21(p?.slot)??4),1,8);return (isKeeper21(p)?KEEPER_USAGE:OUTFIELD_USAGE)[slot]??.10;}
            function targetForPlayer21(p){return isKeeper21(p)?KEEPER_TARGET_FM:fieldTarget21();}
            function equilibriumBudget21(p){return budget21()*targetForPlayer21(p)/targetAverage21();}
            function breakdown21(p){
              const fmv=fmv21(p),games=expectedGames21(p),usage=slotUsage21(p),raw=fmv*games,useful=raw*usage,cpp=creditPerPoint21(),value=useful*cpp,keeper=isKeeper21(p);
              return {fmv,games,usage,raw,useful,creditPerPoint:cpp,value,keeper,targetAverage:targetAverage21(),keeperTarget:KEEPER_TARGET_FM,outfieldTarget:fieldTarget21(),playerTarget:targetForPlayer21(p),equilibriumBudget:equilibriumBudget21(p),roundsRemaining:roundsRemaining21(),budget:budget21(),slot:clamp21(Math.round(n21(p?.slot)??4),1,8)};
            }
            window.v21IndexBreakdown=breakdown21;

            strategicValueIndex=function(player){return Math.max(0,Math.round(breakdown21(player).value));};
            strategicIndexTitle=function(player){
              const x=breakdown21(player),value=Math.max(0,Math.round(x.value)),role=x.keeper?'POR':'MOV';
              return `Indice ${value} cr · ${role} · target squadra ${x.targetAverage.toFixed(2)}: portiere ${x.keeperTarget.toFixed(2)} + 10 movimento ${x.outfieldTarget.toFixed(2)} · quota budget starter ${x.equilibriumBudget.toFixed(1)} cr · FMV ${x.fmv.toFixed(2)} × ${x.games.toFixed(1)} gare = ${x.raw.toFixed(1)} pt · peso utilizzo slot ${x.slot}: ${(x.usage*100).toFixed(0)}% → ${x.useful.toFixed(1)} pt utili · 1 pt = ${x.creditPerPoint.toFixed(3)} cr · nessun prezzo di mercato`;
            };

            function repaint21(){
              if(state.view==='list'&&typeof renderListTable==='function')renderListTable();
              if(state.view==='auction'){
                if(typeof renderAuctionPlayers==='function')renderAuctionPlayers();
                if(String(state.dashboard?.currentUser?.username||'').toLowerCase()==='emanuelesordo'){
                  const p=state.auction?.currentPlayer,s=state.auction?.auctionSession;if(p&&s?.current_player_id){const value=Math.max(1,Number(strategicValueIndex(p)||1)),bid=Math.max(1,Number(s.current_bid||1)),ratio=bid/value;let hue=48;if(ratio<1)hue=48+84*Math.min(1,(1-ratio)/.35);else hue=48*Math.max(0,1-Math.min(1,(ratio-1)/.35));document.querySelectorAll('.auction-command-player').forEach(el=>{el.classList.add('v13-index-border');el.style.setProperty('--v13-hue',String(hue));});}
                }
              }
            }
            queueMicrotask(repaint21);
          })();
          JS
          node --check /tmp/v21.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html');s=p.read_text(encoding='utf-8')
          if 'v21-index-role-redistribution-runtime' in s: raise SystemExit('V21 already present')
          js=Path('/tmp/v21.js').read_text();block='\n<script id="v21-index-role-redistribution-runtime">\n'+js+'\n</script>\n';pos=s.rfind('</body>')
          if pos<0: raise SystemExit('missing body close')
          p.write_text(s[:pos]+block+s[pos:],encoding='utf-8')
          PY
          grep -q 'KEEPER_TARGET_FM=5.50' home.html
          grep -q 'outfieldTarget' home.html
          git diff --check
      - name: Commit V21
        run: |
          rm -f .github/workflows/apply-v21-index-role-redistribution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html .github/workflows/apply-v21-index-role-redistribution.yml
          git commit -m 'fix: redistribute index target between keeper and outfield'
          git push
