name: Apply V20 fixed index
on:
  push:
    paths:
      - '.github/workflows/apply-v20-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append fixed contribution index runtime
        run: |
          cat > /tmp/v20.js <<'JS'
          (()=>{
            'use strict';
            if(window.__FANTA_V20_FIXED_INDEX__)return;
            window.__FANTA_V20_FIXED_INDEX__=1;

            /*
             * INDICE V20
             * Valore fisso in crediti della produzione fantacalcistica attesa.
             * NON usa PFC, PMA, prezzo atteso, soglia, offerte o andamento mercato.
             *
             * 1) Target stagionale ancora da produrre = media-vittoria × giornate residue.
             * 2) Ogni fantapunto utile vale = budget iniziale / target stagionale.
             * 3) Punti utili giocatore = FMV × gare attese × peso utilizzo fantasy.
             * 4) Indice = punti utili × crediti per fantapunto.
             *
             * Gare attese include titolarità prevista e indisponibilità note.
             * Il peso utilizzo fantasy evita di valorizzare allo stesso modo titolari e riserve:
             * slot 1-3 sono presumibilmente da XI, slot 4-8 progressivamente da rotazione/panchina.
             */
            const V20_SLOT_USAGE=Object.freeze({1:1.00,2:.92,3:.80,4:.55,5:.38,6:.26,7:.16,8:.10});
            const n20=v=>Number.isFinite(Number(v))?Number(v):null;
            const clamp20=(v,a,b)=>Math.max(a,Math.min(b,v));

            function v20NextRound(){return clamp20(Number(state.v13NextRound||state.setup?.next_round||1),1,38);}
            function v20RoundsRemaining(){return Math.max(0,39-v20NextRound());}
            function v20Fmv(player){
              const v=typeof strategicExpectedFantasyAverage==='function'?n20(strategicExpectedFantasyAverage(player)):n20(player?.expected_fantasy_avg);
              return Math.max(0,v??0);
            }
            function v20Presence(player){
              const v=typeof strategicPresencePercent==='function'?n20(strategicPresencePercent(player)):n20(player?.expected_titolarity);
              return clamp20(v??0,0,100);
            }
            function v20ExpectedGames(player){
              const remaining=v20RoundsRemaining();
              const next=v20NextRound();
              const until=Math.max(0,n20(player?.unavailable_until_round)??0);
              const forcedMiss=until>=next?Math.min(remaining,until-next+1):0;
              const available=Math.max(0,remaining-forcedMiss);
              return available*v20Presence(player)/100;
            }
            function v20SlotUsage(player){
              const slot=clamp20(Math.round(n20(player?.slot)??4),1,8);
              return V20_SLOT_USAGE[slot]??.55;
            }
            function v20TargetAverage(){
              const v=typeof strategicWinningTargetAverage==='function'?n20(strategicWinningTargetAverage()):null;
              return Math.max(1,v??72);
            }
            function v20InitialBudget(){
              return Math.max(1,n20(state.auction?.settings?.initial_credits)??n20(state.setup?.initial_credits)??500);
            }
            function v20CreditPerPoint(){
              const totalTarget=v20TargetAverage()*v20RoundsRemaining();
              return totalTarget>0?v20InitialBudget()/totalTarget:0;
            }
            function v20RawSeasonPoints(player){return v20Fmv(player)*v20ExpectedGames(player);}
            function v20UsefulSeasonPoints(player){return v20RawSeasonPoints(player)*v20SlotUsage(player);}
            function v20IndexBreakdown(player){
              const fmv=v20Fmv(player),games=v20ExpectedGames(player),usage=v20SlotUsage(player),raw=fmv*games,useful=raw*usage,cpp=v20CreditPerPoint(),value=useful*cpp;
              return {fmv,games,usage,raw,useful,creditPerPoint:cpp,value,targetAverage:v20TargetAverage(),roundsRemaining:v20RoundsRemaining(),budget:v20InitialBudget(),slot:clamp20(Math.round(n20(player?.slot)??4),1,8)};
            }
            window.v20IndexBreakdown=v20IndexBreakdown;
            window.v20SlotUsageWeight=v20SlotUsage;

            strategicValueIndex=function(player){
              return Math.max(0,Math.round(v20IndexBreakdown(player).value));
            };
            strategicIndexTitle=function(player){
              const x=v20IndexBreakdown(player),value=Math.max(0,Math.round(x.value));
              return `Indice ${value} cr · valore fisso di produzione · FMV ${x.fmv.toFixed(2)} × ${x.games.toFixed(1)} gare attese = ${x.raw.toFixed(1)} pt · peso utilizzo slot ${x.slot}: ${(x.usage*100).toFixed(0)}% → ${x.useful.toFixed(1)} pt utili · 1 pt = ${x.creditPerPoint.toFixed(3)} cr · nessun prezzo di mercato usato`;
            };

            /* Mantiene il bordo della chiamata coerente col nuovo Indice in crediti. */
            function paintCalled20(){
              if(String(state.dashboard?.currentUser?.username||'').toLowerCase()!=='emanuelesordo')return;
              const p=state.auction?.currentPlayer,s=state.auction?.auctionSession;if(!p||!s?.current_player_id)return;
              const value=Math.max(1,Number(strategicValueIndex(p)||1)),bid=Math.max(1,Number(s.current_bid||1)),ratio=bid/value;
              let hue=48;if(ratio<1)hue=48+84*Math.min(1,(1-ratio)/.35);else hue=48*Math.max(0,1-Math.min(1,(ratio-1)/.35));
              document.querySelectorAll('.auction-command-player').forEach(el=>{el.classList.add('v13-index-border');el.style.setProperty('--v13-hue',String(hue));el.dataset.indexValue=String(value);el.dataset.indexBid=String(bid);});
            }

            if(typeof renderAuctionLive==='function'){
              const old20=renderAuctionLive;
              renderAuctionLive=function(...a){const r=old20(...a);queueMicrotask(paintCalled20);return r;};
            }
            if(typeof renderListTable==='function'){
              const oldList20=renderListTable;
              renderListTable=function(...a){return oldList20(...a);};
            }

            queueMicrotask(()=>{
              if(state.view==='list'&&typeof renderListTable==='function')renderListTable();
              if(state.view==='auction'){
                if(typeof renderAuctionPlayers==='function')renderAuctionPlayers();
                paintCalled20();
              }
            });
          })();
          JS
          node --check /tmp/v20.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          if 'v20-fixed-contribution-index-runtime' in s:
              raise SystemExit('V20 already present')
          js=Path('/tmp/v20.js').read_text()
          block='\n<script id="v20-fixed-contribution-index-runtime">\n'+js+'\n</script>\n'
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('missing body close')
          s=s[:pos]+block+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'V20_SLOT_USAGE' home.html
          grep -q 'nessun prezzo di mercato usato' home.html
          git diff --check
      - name: Commit V20
        run: |
          rm -f .github/workflows/apply-v20-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.html .github/workflows/apply-v20-index.yml
          git commit -m 'fix: redefine index as fixed fantasy contribution value'
          git push
