name: V34 diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/v34_diag.py'
      - '.github/workflows/v34-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract
        run: python .github/v34_diag.py
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/V34_DIAG.txt
          git diff --cached --quiet || git commit -m "chore: v34 diagnostics"
          git push
